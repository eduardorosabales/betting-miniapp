  <style>
    /* ══════════════════════════════════════════════════════════════════════
       Sistema de diseño (rediseño 2026-10-22, INV-MINI-44): fintech sobrio.
       Una sola familia (Inter, cifras tabulares), superficies grafito, un único
       acento índigo; verde/rojo/ámbar SOLO como color semántico. Sin brillos,
       degradados de texto ni texturas. Los nombres de variables se conservan
       (--font-num, --card2…) porque el JS los usa en estilos inline.
       ══════════════════════════════════════════════════════════════════════ */
    :root {
      color-scheme: dark;
      --bg: #0B0C0E;
      --surface: #121418;
      --card: #16181C;
      --card2: #1F2227;
      --border: rgba(255, 255, 255, 0.07);
      --border-hi: rgba(124, 131, 255, 0.40);
      --accent: #7C83FF;
      --accent-dim: rgba(124, 131, 255, 0.14);
      --on-accent: #FFFFFF;
      --win: #3DD68C;
      --win-bg: rgba(61, 214, 140, 0.12);
      --loss: #FF6B6B;
      --loss-bg: rgba(255, 107, 107, 0.12);
      --pend: #F5B54A;
      --pend-bg: rgba(245, 181, 74, 0.12);
      --text: #F3F4F6;
      --text-2: #A1A6B0;
      --text-3: #6C717B;
      --chart-grid: rgba(255, 255, 255, 0.05);
      --chart-tick: #7A808B;
      --header-bg: rgba(11, 12, 14, 0.82);
      --nav-bg: rgba(18, 20, 24, 0.88);
      --nav-bg-solid: #121418;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.25), 0 10px 30px -12px rgba(0, 0, 0, 0.45);
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-xl: 26px;
      --font-head: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-num: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --nav-h: 68px;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --sidebar-w: 236px;
      --content-max: 980px;
      --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html {
      height: 100%;
      -webkit-text-size-adjust: 100%
    }

    body {
      font-family: var(--font-body);
      font-feature-settings: "cv11", "tnum";
      font-variant-numeric: tabular-nums;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.45;
      min-height: 100svh;
      min-height: 100vh;
      padding-bottom: calc(var(--nav-h) + var(--safe-b) + 20px);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale
    }

    button {
      font-family: inherit;
      -webkit-tap-highlight-color: transparent
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px
    }

    .ico {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      display: inline-block;
      vertical-align: middle
    }

    .ico-sm {
      width: 16px;
      height: 16px
    }

    .ico-lg {
      width: 40px;
      height: 40px;
      color: var(--accent)
    }

    /* ── Sidebar logo: oculto en mobile, visible en desktop vía @media ── */
    .sidebar-logo {
      display: none
    }

    /* ── Performance overrides (Telegram Desktop / Linux) ── */
    .no-blur .header {
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      background: var(--bg) !important
    }

    .no-blur .bottom-nav {
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      background: var(--nav-bg-solid) !important
    }

    .no-blur .section.active,
    .no-blur .m-sheet {
      animation: none !important
    }

    .no-blur .m-overlay {
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important
    }

    .no-blur .progress-fill,
    .no-blur .tipo-bar-fill,
    .no-blur .kelly-fill,
    .no-blur .dia-bar-fill {
      transition: none !important
    }

    .no-blur .loader-bar-fill {
      animation: none !important;
      width: 40%
    }

    /* ── Header ── */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--header-bg);
      backdrop-filter: saturate(160%) blur(18px);
      -webkit-backdrop-filter: saturate(160%) blur(18px);
      padding: 12px 16px;
      left: 0;
      right: 0
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .logo-mark,
    .logo-icon,
    .sidebar-logo-icon {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: var(--accent);
      color: var(--on-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0
    }

    .logo-icon svg,
    .sidebar-logo-icon svg {
      width: 18px;
      height: 18px;
      display: block
    }

    .logo-text {
      font-size: 17px;
      font-weight: 650;
      letter-spacing: -0.02em
    }

    .logo-text span {
      color: inherit
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .refresh-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text-2);
      min-width: 44px;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: color .2s, background .2s, transform .15s
    }

    .refresh-btn:hover {
      color: var(--text)
    }

    .refresh-btn:active {
      transform: scale(0.94)
    }

    .refresh-btn:disabled {
      opacity: 0.4;
      cursor: default
    }

    /* ── Header: saludo + avatar (móvil) ── */
    .user-block {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--accent-dim);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 650;
      font-size: 16px;
      flex-shrink: 0
    }

    .greet {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
      min-width: 0
    }

    .greet .hi {
      font-size: 12.5px;
      color: var(--text-2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 62vw
    }

    .greet .nm {
      font-weight: 650;
      font-size: 17px;
      letter-spacing: -0.02em
    }

    .greet .nm span {
      color: inherit
    }

    .refresh-btn.refresh-round {
      width: 40px;
      height: 40px;
      min-width: 40px;
      min-height: 40px;
      padding: 0;
      border-radius: 50%
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px
    }

    .logout-btn {
      background: transparent;
      border: none;
      color: var(--text-2);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      padding: 6px 10px;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px
    }

    /* ── Content ── */
    .content {
      padding: 8px 16px 16px;
      position: relative;
      z-index: 1
    }

    .section {
      display: none
    }

    .section.active {
      display: block;
      animation: fadein 0.32s var(--ease)
    }

    @keyframes fadein {
      from {
        opacity: 0;
        transform: translateY(8px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    /* ── Bottom nav ── */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(var(--nav-h) + var(--safe-b));
      background: var(--nav-bg);
      backdrop-filter: saturate(160%) blur(22px);
      -webkit-backdrop-filter: saturate(160%) blur(22px);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: stretch;
      z-index: 200;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 0 8px var(--safe-b)
    }

    .bottom-nav::-webkit-scrollbar {
      display: none
    }

    .nav-item {
      min-width: 64px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--text-3);
      padding: 8px 4px;
      transition: color .2s;
      position: relative
    }

    .nav-item:not(.active):hover {
      color: var(--text-2)
    }

    .nav-item.active {
      color: var(--text)
    }

    .nav-icon {
      width: 56px;
      height: 30px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .25s var(--ease), color .25s
    }

    .nav-icon svg {
      width: 22px;
      height: 22px
    }

    .nav-item.active .nav-icon {
      background: var(--accent-dim);
      color: var(--accent)
    }

    .nav-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0
    }

    /* ── Sub-navegación (segmented control) por grupo ── */
    .sub-nav {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
      margin: 4px 0 18px;
      padding: 4px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px
    }

    .sub-nav::-webkit-scrollbar {
      display: none
    }

    .sub-chip {
      flex: 1 0 auto;
      min-height: 40px;
      padding: 0 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: transparent;
      border: none;
      color: var(--text-2);
      border-radius: 999px;
      font-size: 14px;
      font-weight: 550;
      white-space: nowrap;
      cursor: pointer;
      transition: color .2s, background .2s
    }

    .sub-chip.active {
      color: var(--text);
      background: var(--card2);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.18)
    }

    .sub-chip:active {
      transform: scale(0.97)
    }

    .sub-chip.sub-more,
    .sub-chip.sub-back {
      color: var(--accent);
      font-weight: 600
    }

    .sub-chip svg {
      width: 16px;
      height: 16px
    }

    /* ── Resumen: tarjeta héroe (número protagonista + sparkline) ── */
    .hero {
      position: relative;
      background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 9%, var(--card)) 0%, var(--card) 70%);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 22px 20px 0;
      margin-bottom: 12px;
      overflow: hidden
    }

    .hero-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px
    }

    .hero-eyebrow {
      font-size: 13.5px;
      color: var(--text-2);
      font-weight: 500
    }

    .hero-amount {
      font-size: 44px;
      font-weight: 650;
      letter-spacing: -0.035em;
      line-height: 1.02;
      color: var(--text)
    }

    .hero-amount.green {
      color: var(--text)
    }

    .hero-amount.red {
      color: var(--loss)
    }

    .hero-subline {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 10px;
      margin-top: 8px;
      font-size: 14px;
      color: var(--text-2)
    }

    .delta {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-weight: 600;
      font-size: 13px;
      padding: 3px 9px;
      border-radius: 999px
    }

    .delta.up {
      color: var(--win);
      background: var(--win-bg)
    }

    .delta.down {
      color: var(--loss);
      background: var(--loss-bg)
    }

    .delta svg {
      width: 14px;
      height: 14px
    }

    .hero-spark {
      display: block;
      width: calc(100% + 40px);
      height: 84px;
      margin: 14px -20px 0
    }

    .hero-metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid var(--border);
      margin: 0 -20px
    }

    .hero-metric {
      padding: 14px 12px 16px;
      text-align: center
    }

    .hero-metric+.hero-metric {
      border-left: 1px solid var(--border)
    }

    .hero-metric-v {
      font-size: 17px;
      font-weight: 650;
      letter-spacing: -0.02em
    }

    .hero-metric-l {
      font-size: 12px;
      color: var(--text-2);
      margin-top: 2px
    }

    .hero-metric .eq-line {
      text-align: center
    }

    .action-row {
      display: flex;
      gap: 8px;
      margin-bottom: 24px
    }

    .pill-btn {
      flex: 1;
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 16px;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background .2s, transform .15s
    }

    .pill-btn:hover {
      background: var(--card2)
    }

    .pill-btn:active {
      transform: scale(0.97)
    }

    .pill-btn.primary {
      background: var(--accent);
      border-color: transparent;
      color: var(--on-accent)
    }

    .pill-btn:disabled {
      opacity: .6;
      cursor: default
    }

    /* Rejilla de 4 métricas (se conserva para el skeleton y vistas heredadas). */
    .hero-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px
    }

    .hero-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px
    }

    .hero-label {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-2);
      margin-bottom: 6px
    }

    .hero-value {
      font-size: 26px;
      font-weight: 650;
      letter-spacing: -0.03em;
      line-height: 1.05
    }

    /* ── Barra de resultados (ganadas/perdidas/pendientes/nulas) ── */
    .seg-bar {
      display: flex;
      gap: 3px;
      height: 10px;
      margin: 4px 0 16px
    }

    .seg-bar i {
      display: block;
      height: 100%;
      border-radius: 999px;
      min-width: 4px
    }

    .seg-legend {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px 16px
    }

    .seg-item {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0
    }

    .seg-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0
    }

    .seg-item-l {
      flex: 1;
      font-size: 13.5px;
      color: var(--text-2)
    }

    .seg-item-v {
      font-size: 15px;
      font-weight: 650
    }

    /* ── Lista de filas etiqueta / valor ── */
    .stat-list {
      margin: -12px 0
    }

    .card-head+.stat-list {
      margin-top: -6px
    }

    .stat-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 0;
      border-top: 1px solid var(--border)
    }

    .stat-row:first-child {
      border-top: none
    }

    .stat-row-l {
      font-size: 14px;
      color: var(--text-2);
      min-width: 0
    }

    .stat-row-v {
      font-size: 15px;
      font-weight: 600;
      text-align: right;
      white-space: nowrap
    }

    .stat-row-v .eq-line {
      text-align: right;
      font-weight: 400
    }

    .card-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px
    }

    .card-head .card-title {
      margin-bottom: 0
    }

    .card-meta {
      font-size: 12.5px;
      color: var(--text-3);
      white-space: nowrap
    }

    /* Forma reciente: secuencia de resultados en píldoras. */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px
    }

    .form-cell-l {
      font-size: 12.5px;
      color: var(--text-2);
      margin-bottom: 4px
    }

    .form-cell-v {
      font-size: 22px;
      font-weight: 650;
      letter-spacing: -0.02em
    }

    .form-cell-s {
      font-size: 13px;
      font-weight: 600;
      margin-top: 2px
    }

    .nav-label {
      font-size: 11px
    }

    /* ── Cards ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px;
      margin-bottom: 12px;
      position: relative;
      overflow: hidden
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
      margin-bottom: 14px
    }

    /* ── Stats grid: un panel agrupado con divisores, no cajas sueltas ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin-bottom: 12px
    }

    .stat-card {
      background: var(--card);
      padding: 16px 10px;
      text-align: center;
      position: relative
    }

    .stat-value {
      font-size: 24px;
      font-weight: 650;
      letter-spacing: -0.02em;
      line-height: 1.1;
      margin-bottom: 3px
    }

    .stat-label {
      font-size: 12.5px;
      color: var(--text-2);
      font-weight: 500
    }

    /* ── KPI: filas agrupadas en un panel con divisores ── */
    .kpi-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin-bottom: 12px
    }

    .kpi {
      background: var(--card);
      padding: 16px;
      min-width: 0
    }

    .kpi:last-child:nth-child(odd) {
      grid-column: 1 / -1
    }

    .kpi-row.three {
      grid-template-columns: repeat(3, 1fr)
    }

    .kpi-row.three .kpi:last-child:nth-child(odd) {
      grid-column: auto
    }

    /* Dentro de una tarjeta, los KPI son baldosas suaves (no un panel con borde). */
    .card .kpi-row {
      background: none;
      border: none;
      border-radius: 0;
      gap: 8px;
      overflow: visible
    }

    .card .kpi {
      background: var(--card2);
      border-radius: var(--radius-md);
      padding: 12px 14px
    }

    .card .kpi-value {
      font-size: 18px
    }

    .kpi-label {
      font-size: 12.5px;
      color: var(--text-2);
      font-weight: 500;
      margin-bottom: 6px
    }

    .kpi-value {
      font-size: 21px;
      font-weight: 650;
      letter-spacing: -0.02em;
      line-height: 1.15;
      overflow-wrap: anywhere
    }

    /* ── Colors ── */
    .green {
      color: var(--win)
    }

    .red {
      color: var(--loss)
    }

    .yellow {
      color: var(--pend)
    }

    .accent {
      color: var(--accent)
    }

    .muted {
      color: var(--text-2)
    }

    /* La cifra "neutra" principal no se tiñe de acento (solo dato). */
    .kpi-value.accent,
    .stat-value.accent {
      color: var(--text)
    }

    /* ── Progress ── */
    .progress-wrap {
      margin-bottom: 4px
    }

    .progress-labels {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px
    }

    .progress-track {
      height: 8px;
      background: var(--card2);
      border-radius: 999px;
      overflow: hidden
    }

    .progress-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--accent);
      transition: width 0.8s var(--ease)
    }

    /* ── Chart ── */
    .chart-wrap {
      position: relative;
      height: 220px;
      margin-bottom: 2px
    }

    .chart-wrap-tall {
      position: relative;
      height: 230px;
      margin-bottom: 2px
    }

    .lazy-chart-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-2);
      padding: 10px 20px;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer
    }

    /* ── Selector de rango de gráficas ── */
    .range-sel {
      display: inline-flex;
      gap: 2px;
      padding: 3px;
      background: var(--card2);
      border-radius: 999px;
      margin-bottom: 14px
    }

    .range-chip {
      flex: 0 0 auto;
      min-height: 36px;
      padding: 0 14px;
      display: inline-flex;
      align-items: center;
      background: transparent;
      border: none;
      color: var(--text-2);
      border-radius: 999px;
      font-size: 13px;
      font-weight: 550;
      cursor: pointer;
      transition: color .2s, background .2s
    }

    .range-chip.active {
      color: var(--text);
      background: var(--card);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.18)
    }

    .range-chip:active {
      transform: scale(0.96)
    }

    /* ── Sport items ── */
    .sport-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border)
    }

    .sport-item:last-child {
      border-bottom: none
    }

    .sport-name {
      font-size: 14.5px;
      font-weight: 600
    }

    .sport-sub {
      font-size: 12.5px;
      color: var(--text-2);
      margin-top: 2px
    }

    .sport-roi {
      font-size: 15px;
      font-weight: 650
    }

    /* ── Capital ── */
    .capital-hero {
      text-align: center;
      padding: 22px 0 14px
    }

    .capital-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-2);
      margin-bottom: 8px
    }

    .capital-amount {
      font-size: 40px;
      font-weight: 650;
      color: var(--text);
      line-height: 1.05;
      letter-spacing: -0.035em
    }

    .capital-sub {
      font-size: 13px;
      color: var(--text-2);
      margin-top: 8px
    }

    .cap-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-top: 16px
    }

    .cap-stat {
      background: var(--card);
      padding: 14px 12px;
      text-align: center
    }

    .cap-stat:last-child:nth-child(odd) {
      grid-column: 1 / -1
    }

    .cap-stat-val {
      font-size: 17px;
      font-weight: 650;
      letter-spacing: -0.01em;
      margin-bottom: 3px
    }

    .cap-stat-lbl {
      font-size: 12px;
      color: var(--text-2);
      font-weight: 500
    }

    /* ── Bet items (filas de historial) ── */
    .bet-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 0;
      border-bottom: 1px solid var(--border)
    }

    .bet-item:last-child {
      border-bottom: none
    }

    .bet-dot {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .bet-dot svg {
      width: 16px;
      height: 16px
    }

    .bet-dot.win {
      background: var(--win-bg);
      color: var(--win)
    }

    .bet-dot.loss {
      background: var(--loss-bg);
      color: var(--loss)
    }

    .bet-dot.pend {
      background: var(--pend-bg);
      color: var(--pend)
    }

    .bet-dot.void {
      background: var(--card2);
      color: var(--text-2)
    }

    .bet-info {
      flex: 1;
      min-width: 0
    }

    .bet-teams {
      font-size: 14.5px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px
    }

    .bet-meta {
      font-size: 12.5px;
      color: var(--text-2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .bet-legs {
      white-space: normal
    }

    .bet-right {
      text-align: right;
      flex-shrink: 0
    }

    .bet-monto {
      font-size: 12.5px;
      color: var(--text-2);
      font-weight: 500
    }

    .bet-result {
      font-size: 14.5px;
      font-weight: 650;
      margin-top: 1px
    }

    .bet-badge {
      display: none
    }

    .bet-badge-win {
      color: var(--win);
      background: var(--win-bg)
    }

    .bet-badge-loss {
      color: var(--loss);
      background: var(--loss-bg)
    }

    .bet-badge-pend {
      color: var(--pend);
      background: var(--pend-bg)
    }

    .bet-badge-void {
      color: var(--text-2);
      background: var(--card2)
    }

    /* ── Skeleton loaders (carga en frío, nunca pantalla en blanco) ── */
    .skeleton {
      border-radius: var(--radius-lg);
      background-color: var(--card);
      background-image: linear-gradient(90deg, transparent 25%, color-mix(in srgb, var(--text) 6%, transparent) 50%, transparent 75%);
      background-size: 200% 100%;
      animation: sk-shimmer 1.4s ease-in-out infinite;
      margin-bottom: 12px
    }

    .skeleton.sk-hero {
      border-radius: var(--radius-xl)
    }

    .hero-grid .skeleton {
      margin-bottom: 0
    }

    @keyframes sk-shimmer {
      0% {
        background-position: 200% 0
      }

      100% {
        background-position: -200% 0
      }
    }

    .no-blur .skeleton {
      animation: none
    }

    /* ── Banner de datos en caché (fetch falló pero hay datos guardados) ── */
    .stale-banner {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--pend-bg);
      color: var(--pend);
      font-size: 13.5px;
      font-weight: 550;
      padding: 10px 10px 10px 14px;
      border-radius: var(--radius-md);
      margin-bottom: 12px
    }

    .stale-banner button {
      margin-left: auto;
      flex-shrink: 0;
      background: var(--pend);
      color: #1A1204;
      border: none;
      border-radius: 999px;
      padding: 0 16px;
      min-height: 38px;
      font-weight: 650;
      cursor: pointer
    }

    /* ── Filters ── */
    .filter-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      margin-bottom: 14px;
      scrollbar-width: none;
      padding-bottom: 2px
    }

    .filter-row::-webkit-scrollbar {
      display: none
    }

    .filter-chip {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      padding: 0 16px;
      border-radius: 999px;
      font-size: 13.5px;
      font-weight: 550;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text-2);
      cursor: pointer;
      white-space: nowrap;
      transition: color .2s, background .2s, border-color .2s
    }

    .filter-chip.active {
      background: var(--text);
      border-color: var(--text);
      color: var(--bg)
    }

    /* ── Search ── */
    .search-wrap {
      position: relative;
      margin-bottom: 12px
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--text-3);
      display: flex
    }

    .search-icon svg {
      width: 18px;
      height: 18px
    }

    .search-input {
      width: 100%;
      min-height: 46px;
      padding: 10px 16px 10px 42px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 15px;
      outline: none;
      transition: border-color .2s
    }

    .search-input:focus {
      border-color: var(--border-hi)
    }

    .search-input::placeholder {
      color: var(--text-3)
    }

    /* ── Mes selector ── */
    .mes-selector {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px
    }

    .mes-nav {
      background: transparent;
      border: none;
      color: var(--text);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .2s
    }

    .mes-nav:hover:not(:disabled) {
      background: var(--card2)
    }

    .mes-nav svg {
      width: 20px;
      height: 20px
    }

    .mes-nav:active {
      transform: scale(0.92)
    }

    .mes-nav:disabled {
      opacity: .3;
      cursor: default
    }

    .mes-label {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em
    }

    /* ── Racha badge ── */
    .racha-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 550;
      margin-bottom: 12px
    }

    .racha-win {
      background: var(--win-bg);
      color: var(--win)
    }

    .racha-loss {
      background: var(--loss-bg);
      color: var(--loss)
    }

    .racha-icon {
      display: flex
    }

    .racha-icon svg {
      width: 18px;
      height: 18px
    }

    /* ── Loader ── */
    .loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 70vh;
      gap: 18px
    }

    .loader-logo {
      font-size: 22px;
      font-weight: 650;
      letter-spacing: -0.02em
    }

    .loader-logo span {
      color: inherit
    }

    .loader-bar {
      width: 96px;
      height: 3px;
      background: var(--card2);
      border-radius: 999px;
      overflow: hidden
    }

    .loader-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 999px;
      animation: loader-slide 1.4s var(--ease) infinite
    }

    @keyframes loader-slide {
      0% {
        width: 0%;
        margin-left: 0
      }

      50% {
        width: 60%;
        margin-left: 20%
      }

      100% {
        width: 0%;
        margin-left: 100%
      }
    }

    .loader p {
      font-size: 13px;
      color: var(--text-2)
    }

    /* ── Error ── */
    .error-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px 20px;
      text-align: center;
      margin: 20px 0
    }

    .error-box p {
      color: var(--text);
      font-size: 16px;
      font-weight: 600
    }

    .error-box small {
      color: var(--text-2);
      font-size: 13px
    }

    .retry-btn {
      margin-top: 14px;
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 22px;
      background: var(--accent);
      color: var(--on-accent);
      border: none;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer
    }

    .retry-btn.ghost {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border)
    }

    /* ── Empty / Explainer ── */
    .empty {
      text-align: center;
      padding: 32px 20px;
      color: var(--text-2);
      font-size: 14px
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 4px 0 12px
    }

    .section-header {
      font-size: 22px;
      font-weight: 650;
      letter-spacing: -0.025em;
      margin: 8px 0 14px;
      color: var(--text)
    }

    .section-header span {
      color: inherit
    }

    .explainer {
      font-size: 13.5px;
      color: var(--text-2);
      line-height: 1.6;
      padding: 14px 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      margin-top: 8px
    }

    .explainer strong {
      color: var(--text);
      font-weight: 600
    }

    /* ── Tipo row ── */
    .tipo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid var(--border)
    }

    .tipo-item:last-child {
      border-bottom: none
    }

    .tipo-bar-wrap {
      height: 6px;
      background: var(--card2);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 6px;
      width: 100%
    }

    .tipo-bar-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.8s var(--ease)
    }

    /* ── Rolling chart ── */
    .rolling-kpi {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin-bottom: 12px
    }

    .rolling-kpi-item {
      background: var(--card);
      padding: 14px 10px;
      text-align: center
    }

    .rolling-kpi-val {
      font-size: 19px;
      font-weight: 650;
      letter-spacing: -0.02em
    }

    .rolling-kpi-lbl {
      font-size: 12px;
      color: var(--text-2);
      margin-top: 3px
    }

    /* ── Kelly meter ── */
    .kelly-meter {
      height: 10px;
      background: var(--card2);
      border-radius: 999px;
      overflow: hidden;
      margin: 10px 0
    }

    .kelly-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--accent);
      transition: width 0.8s var(--ease)
    }

    .kelly-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      margin-top: 12px
    }

    .kelly-card {
      background: var(--card);
      padding: 14px 8px;
      text-align: center
    }

    .kelly-card-pct {
      font-size: 20px;
      font-weight: 650;
      letter-spacing: -0.02em;
      color: var(--text)
    }

    .kelly-card-lbl {
      font-size: 12px;
      color: var(--text-2);
      font-weight: 500;
      margin-top: 3px
    }

    .kelly-card-sub {
      font-size: 11.5px;
      color: var(--text-3);
      margin-top: 2px
    }

    /* ── Temporal ── */
    .dia-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border)
    }

    .dia-row:last-child {
      border-bottom: none
    }

    .dia-label {
      font-size: 13px;
      font-weight: 600;
      width: 36px;
      flex-shrink: 0;
      color: var(--text-2)
    }

    .dia-bar-wrap {
      flex: 1;
      height: 8px;
      background: var(--card2);
      border-radius: 999px;
      overflow: hidden
    }

    .dia-bar-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.8s var(--ease)
    }

    .dia-roi {
      font-size: 13px;
      font-weight: 650;
      width: 58px;
      text-align: right;
      flex-shrink: 0
    }

    .dia-wl {
      font-size: 12px;
      color: var(--text-2);
      width: 64px;
      white-space: nowrap;
      text-align: right;
      flex-shrink: 0
    }

    /* ── Gestión CRUD ── */
    .g-toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px
    }

    .g-count {
      font-size: 12.5px;
      color: var(--text-3);
      margin-left: auto
    }

    .btn-add {
      -webkit-appearance: none;
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--accent);
      color: var(--on-accent);
      border: none;
      border-radius: 999px;
      padding: 0 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      min-height: 46px;
      transition: transform .15s, filter .2s
    }

    .btn-add:hover {
      filter: brightness(1.06)
    }

    .btn-add:active {
      transform: scale(0.97)
    }

    .g-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 14px 14px 16px;
      margin-bottom: 8px
    }

    .g-card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px
    }

    .g-main {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1
    }

    .g-teams {
      font-size: 14.5px;
      font-weight: 600;
      line-height: 1.35
    }

    .g-meta {
      font-size: 12.5px;
      color: var(--text-2);
      margin-top: 3px;
      line-height: 1.45
    }

    .g-actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0
    }

    .btn-edit,
    .btn-del {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      cursor: pointer;
      transition: background .2s, color .2s
    }

    .btn-edit {
      background: var(--card2);
      color: var(--text-2)
    }

    .btn-edit:hover {
      color: var(--text)
    }

    .btn-del {
      background: var(--loss-bg);
      color: var(--loss)
    }

    .btn-edit svg,
    .btn-del svg {
      width: 17px;
      height: 17px
    }

    /* Modal */
    .m-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 6, 8, 0.6);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 9999;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: var(--nav-h)
    }

    /* Modal — estructura flexbox con footer sticky */
    .m-sheet {
      background: var(--surface);
      border-radius: 28px 28px 20px 20px;
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.4);
      animation: sheet-in .32s var(--ease)
    }

    @keyframes sheet-in {
      from {
        transform: translateY(24px);
        opacity: 0
      }

      to {
        transform: none;
        opacity: 1
      }
    }

    .m-handle {
      width: 36px;
      height: 4px;
      background: color-mix(in srgb, var(--text) 22%, transparent);
      border-radius: 999px;
      margin: 10px auto 0;
      flex-shrink: 0
    }

    .m-head {
      padding: 14px 20px 12px;
      flex-shrink: 0
    }

    .m-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 6px 20px 10px;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain
    }

    .m-foot {
      flex-shrink: 0;
      padding: 12px 20px;
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
      background: var(--surface);
      border-top: 1px solid var(--border)
    }

    .m-title {
      font-size: 19px;
      font-weight: 650;
      letter-spacing: -0.02em;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px
    }

    .m-close {
      background: var(--card2);
      border: none;
      color: var(--text-2);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0
    }

    .m-close svg {
      width: 18px;
      height: 18px
    }

    .m-label {
      display: block;
      font-size: 12.5px;
      font-weight: 550;
      color: var(--text-2);
      margin-bottom: 6px
    }

    .m-input {
      width: 100%;
      min-height: 46px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 15px;
      padding: 10px 14px;
      outline: none;
      box-sizing: border-box;
      transition: border-color .2s, box-shadow .2s
    }

    .m-input:focus {
      border-color: var(--border-hi);
      box-shadow: 0 0 0 3px var(--accent-dim)
    }

    .m-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }

    .m-group {
      margin-bottom: 14px
    }

    .m-date-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 6px
    }

    .m-now-btn {
      flex-shrink: 0;
      min-height: 46px;
      background: var(--accent-dim);
      color: var(--accent);
      border: none;
      border-radius: var(--radius-md);
      padding: 0 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap
    }

    .m-submit {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 52px;
      background: var(--accent);
      color: var(--on-accent);
      border: none;
      border-radius: 999px;
      padding: 0 16px;
      font-size: 15px;
      font-weight: 650;
      cursor: pointer;
      transition: transform .15s, filter .2s, opacity .15s
    }

    @media (hover: hover) {
      .m-submit:hover {
        filter: brightness(1.06)
      }
    }

    .m-submit:active {
      transform: scale(.985)
    }

    .m-submit:disabled {
      opacity: .55;
      cursor: not-allowed;
      transform: none;
      filter: none
    }

    .m-err {
      font-size: 13px;
      color: var(--loss);
      margin-bottom: 10px;
      display: none;
      padding: 10px 12px;
      background: var(--loss-bg);
      border-radius: var(--radius-sm)
    }

    /* Upload zone */
    .u-zone {
      border: 1.5px dashed color-mix(in srgb, var(--text) 18%, transparent);
      border-radius: var(--radius-lg);
      padding: 22px 16px;
      text-align: center;
      cursor: pointer;
      margin-bottom: 14px;
      background: var(--card);
      transition: border-color .2s, background .2s
    }

    .u-zone:hover,
    .u-zone.drag {
      border-color: var(--accent);
      background: var(--accent-dim)
    }

    .u-icon {
      font-size: 26px;
      margin-bottom: 6px;
      color: var(--accent);
      display: flex;
      justify-content: center
    }

    .u-icon svg {
      width: 28px;
      height: 28px
    }

    .u-text {
      font-size: 14px;
      color: var(--text);
      font-weight: 550
    }

    .u-sub {
      font-size: 12px;
      color: var(--text-3);
      margin-top: 3px
    }

    .u-analyzing {
      background: var(--pend-bg);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: 13px;
      color: var(--pend);
      display: none;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px
    }

    /* Secret banner */
    .secret-banner {
      background: var(--pend-bg);
      border-radius: var(--radius-md);
      padding: 14px;
      margin-bottom: 12px;
      font-size: 13.5px;
      color: var(--text-2);
      line-height: 1.5
    }

    .secret-banner strong {
      color: var(--pend)
    }

    .secret-input {
      margin-top: 10px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 14px;
      padding: 10px 12px;
      box-sizing: border-box;
      outline: none
    }

    .secret-save {
      margin-top: 8px;
      background: var(--pend);
      color: #1A1204;
      border: none;
      border-radius: 999px;
      padding: 9px 18px;
      font-size: 13px;
      font-weight: 650;
      cursor: pointer
    }

    /* ── Patrones IA: render enriquecido ── */
    .pat-wrap {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .pat-hero {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 17px;
      font-weight: 650;
      letter-spacing: -.015em;
      color: var(--text);
      padding: 16px 18px;
      border-radius: var(--radius-lg);
      background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 10%, var(--card)), var(--card));
      border: 1px solid var(--border);
    }

    .pat-hero .pat-ico {
      font-size: 20px;
      line-height: 1;
      flex-shrink: 0;
    }

    .pat-sec {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
      padding: 2px 2px;
      font-weight: 650;
      font-size: 15px;
      letter-spacing: -.01em;
      color: var(--text);
    }

    .pat-sec::before {
      content: "";
      width: 4px;
      height: 18px;
      border-radius: 999px;
      background: var(--text-3);
      flex-shrink: 0
    }

    .pat-sec .pat-ico {
      font-size: 16px;
      line-height: 1;
      flex-shrink: 0;
    }

    .pat-sec--good::before {
      background: var(--win);
    }

    .pat-sec--bad::before {
      background: var(--loss);
    }

    .pat-sec--info::before {
      background: var(--accent);
    }

    .pat-sec--plan::before {
      background: var(--pend);
    }

    .pat-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
    }

    .pat-card--good {
      box-shadow: inset 3px 0 0 var(--win);
    }

    .pat-card--bad {
      box-shadow: inset 3px 0 0 var(--loss);
    }

    .pat-card--info {
      box-shadow: inset 3px 0 0 var(--accent);
    }

    .pat-card--plan {
      box-shadow: inset 3px 0 0 var(--pend);
    }

    .pat-card-title {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
    }

    .pat-metrics {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .pat-metric {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      background: var(--card2);
    }

    .pat-metric-k {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-3);
    }

    .pat-metric-v {
      font-size: 14px;
      font-weight: 650;
      color: var(--text);
      line-height: 1.3;
    }

    .pat-metric--roi-pos,
    .pat-metric--money-pos {
      background: var(--win-bg);
    }

    .pat-metric--roi-pos .pat-metric-v,
    .pat-metric--money-pos .pat-metric-v {
      color: var(--win);
    }

    .pat-metric--roi-neg,
    .pat-metric--money-neg {
      background: var(--loss-bg);
    }

    .pat-metric--roi-neg .pat-metric-v,
    .pat-metric--money-neg .pat-metric-v {
      color: var(--loss);
    }

    .pat-metric--wr .pat-metric-v {
      color: var(--text);
    }

    .pat-metric--sample .pat-metric-v {
      color: var(--text-2);
      font-size: 13px;
    }

    .pat-tip,
    .pat-warn,
    .pat-note {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      font-size: 13px;
      line-height: 1.55;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      color: var(--text-2);
    }

    .pat-tip {
      background: var(--card2);
    }

    .pat-warn {
      background: var(--loss-bg);
      color: var(--text);
    }

    .pat-note {
      background: var(--accent-dim);
      color: var(--text);
    }

    .pat-tip .pat-ico,
    .pat-warn .pat-ico,
    .pat-note .pat-ico {
      font-size: 14px;
      line-height: 1.4;
      flex-shrink: 0;
    }

    .pat-conf {
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-2);
      background: var(--card2);
    }

    .pat-conf-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-3);
      flex-shrink: 0;
    }

    .pat-conf strong {
      font-weight: 700;
    }

    .pat-conf--alta {
      background: var(--win-bg);
      color: var(--win);
    }

    .pat-conf--alta .pat-conf-dot {
      background: var(--win);
    }

    .pat-conf--media {
      background: var(--pend-bg);
      color: var(--pend);
    }

    .pat-conf--media .pat-conf-dot {
      background: var(--pend);
    }

    .pat-list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden
    }

    .pat-list li {
      position: relative;
      padding: 12px 14px 12px 30px;
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--text-2);
      border-top: 1px solid var(--border);
    }

    .pat-list li:first-child {
      border-top: none
    }

    .pat-list li::before {
      content: "";
      position: absolute;
      left: 14px;
      top: 20px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }

    .pat-steps {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .pat-step {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
    }

    .pat-step-n {
      flex-shrink: 0;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--accent-dim);
      color: var(--accent);
      font-weight: 650;
      font-size: 12.5px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pat-step-t {
      font-size: 13.5px;
      line-height: 1.45;
      color: var(--text);
    }

    .pat-p {
      font-size: 13.5px;
      line-height: 1.65;
      color: var(--text-2);
    }

    .pat-li {
      position: relative;
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--text-2);
      padding-left: 16px;
    }

    .pat-li::before {
      content: "•";
      position: absolute;
      left: 3px;
      color: var(--accent);
    }

    .pat-num {
      font-weight: 650;
    }

    .pat-num.pos {
      color: var(--win);
    }

    .pat-num.neg {
      color: var(--loss);
    }

    .pat-wrap code {
      background: var(--card2);
      padding: 1px 6px;
      border-radius: 6px;
      font-size: 12px;
      font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    }

    .pat-wrap strong {
      color: var(--text);
      font-weight: 650;
    }

    .pat-wrap em {
      color: var(--text-2);
      font-style: italic;
    }

    /* ── Motor de Neto Mensual (ANM) ── */
    .nm-wrap {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 18px;
    }

    .nm-resumen {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .nm-stat {
      flex: 1 1 30%;
      min-width: 96px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      background: var(--card);
      border: 1px solid var(--border);
    }

    .nm-stat-k {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-2);
    }

    .nm-stat-v {
      font-size: 15px;
      font-weight: 650;
      color: var(--text);
      line-height: 1.3;
    }

    .nm-stat-v.pos {
      color: var(--win);
    }

    .nm-stat-v.neg {
      color: var(--pend);
    }

    .nm-stat small {
      font-size: 11.5px;
      color: var(--text-2);
      line-height: 1.35;
    }

    .nm-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nm-card {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
    }

    .nm-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .nm-mes {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text);
    }

    .nm-neto {
      font-size: 15px;
      font-weight: 650;
    }

    .nm-neto.pos {
      color: var(--win);
    }

    .nm-neto.neg {
      color: var(--loss);
    }

    .nm-neto-tag {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-3);
      margin-left: 4px;
      vertical-align: middle;
    }

    .nm-driver {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .nm-chip {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-dim);
    }

    .nm-driver small {
      font-size: 12px;
      color: var(--text-2);
    }

    .nm-badge.low {
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      color: var(--pend);
      background: var(--pend-bg);
    }

    .nm-bar {
      position: relative;
      height: 18px;
      border-radius: 999px;
      background: var(--card2);
      overflow: hidden;
    }

    .nm-bar-fill {
      position: absolute;
      inset: 0 auto 0 0;
      background: var(--accent);
      border-radius: 999px;
    }

    .nm-bar-lbl {
      position: absolute;
      right: 10px;
      top: 0;
      line-height: 18px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text);
    }

    .nm-dims {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .nm-dim {
      font-size: 12px;
      color: var(--text-2);
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--card2);
    }

    .nm-dim b {
      color: var(--text);
      font-weight: 600;
    }

    /* ── Pantalla de login web (fuera de Telegram) ── */
    #web-login {
      display: none;
      min-height: 100svh;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .wl-card {
      max-width: 380px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 36px 28px 28px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .wl-mark {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: var(--accent);
      color: var(--on-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
    }

    .wl-mark svg {
      width: 28px;
      height: 28px;
    }

    .wl-logo {
      font-size: 26px;
      font-weight: 650;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }

    .wl-logo span {
      color: inherit;
    }

    .wl-sub {
      color: var(--text-2);
      font-size: 14.5px;
      line-height: 1.55;
      margin-bottom: 26px;
    }

    .wl-widget {
      display: flex;
      justify-content: center;
      margin-bottom: 12px;
    }

    .wl-hint {
      font-size: 12.5px;
      color: var(--text-3);
      margin-top: 16px;
    }

    .wl-err {
      color: var(--loss);
      font-size: 13px;
      margin-top: 10px;
      min-height: 18px;
    }

    /* ── Simulador "what-if" / backtest (INV-MINI-26) ── */
    .bt-form { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
    .bt-form > *, .bt-field input { min-width: 0; }
    .bt-field { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; color: var(--text-2); font-weight: 500; }
    .bt-input-wrap { display: flex; align-items: center; background: var(--card2); border: 1px solid transparent; border-radius: var(--radius-md); overflow: hidden; }
    .bt-input-wrap:focus-within { border-color: var(--border-hi); }
    .bt-input-wrap .bt-prefix { padding: 0 4px 0 12px; color: var(--text-3); font-size: 15px; }
    .bt-input-wrap .bt-input { border: none; background: transparent; }
    .bt-input {
      width: 100%; box-sizing: border-box; background: var(--card2);
      border: 1px solid transparent; border-radius: var(--radius-md);
      color: var(--text); font-size: 16px; font-family: var(--font-num);
      padding: 10px 12px; min-height: 46px;
    }
    .bt-input:focus { outline: none; border-color: var(--border-hi); }
    .bt-flbl { font-size: 13px; font-weight: 600; color: var(--text); margin: 16px 0 8px; }
    .bt-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .bt-chip {
      background: var(--card2); border: 1px solid transparent; color: var(--text-2);
      border-radius: 999px; padding: 0 14px; font-size: 13.5px; font-weight: 500; cursor: pointer;
      min-height: 38px; transition: color .2s, background .2s;
    }
    .bt-chip.active { background: var(--text); color: var(--bg); font-weight: 600; }
    .bt-modo-row { display: flex; gap: 4px; margin-top: 12px; padding: 4px; background: var(--card2); border-radius: 999px; }
    .bt-modo-row .bt-chip { flex: 1; text-align: center; min-height: 40px; background: transparent; }
    .bt-modo-row .bt-chip.active { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(0, 0, 0, .18); }
    .bt-actions { display: flex; gap: 8px; margin-bottom: 14px; }
    .bt-run {
      flex: 1; background: var(--accent); color: var(--on-accent); border: none;
      border-radius: 999px; padding: 0 16px; font-size: 15px; font-weight: 650;
      cursor: pointer; min-height: 50px;
    }
    .bt-run:disabled { opacity: .6; cursor: default; }
    .bt-reset {
      background: var(--card); border: 1px solid var(--border); color: var(--text);
      border-radius: 999px; padding: 0 20px; font-size: 14px; font-weight: 550; cursor: pointer; min-height: 50px;
    }
    .bt-alert { font-size: 13px; line-height: 1.55; padding: 12px 14px; border-radius: var(--radius-md); margin-top: 10px; }
    .bt-alert-red, .bt-alert-danger { background: var(--loss-bg); color: var(--text); box-shadow: inset 3px 0 0 var(--loss); }
    .bt-alert-amber { background: var(--pend-bg); color: var(--text); box-shadow: inset 3px 0 0 var(--pend); }
    .bt-alert-muted { background: var(--card2); color: var(--text-2); }
    .bt-cmp { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; margin-bottom: 12px; }
    .bt-cmp-row { display: flex; justify-content: space-between; align-items: center; font-size: 13.5px; color: var(--text-2); padding: 6px 0; }
    .bt-search-btn {
      width: 100%; box-sizing: border-box; margin: 4px 0;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      background: var(--accent-dim); border: none; color: var(--accent);
      border-radius: 999px; padding: 0 16px; font-size: 14px; font-weight: 600;
      cursor: pointer; min-height: 48px;
    }
    .bt-search-btn:disabled { opacity: .6; cursor: default; }
    .bt-cands { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
    .bt-cand { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; }
    .bt-cand-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .bt-cand-lbl { font-weight: 600; font-size: 14px; color: var(--text); }
    .bt-badge { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
    .bt-badge-ok { background: var(--win-bg); color: var(--win); }
    .bt-badge-warn { background: var(--pend-bg); color: var(--pend); }
    .bt-badge-muted { background: var(--card2); color: var(--text-3); }
    .bt-cand-metrics { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 10px 0; font-size: 12.5px; color: var(--text-2); }
    .bt-cand-apply { width: 100%; background: var(--card2); border: none; color: var(--text); border-radius: 999px; padding: 0 12px; font-size: 13px; font-weight: 600; cursor: pointer; min-height: 40px; }

    /* ── Calendario (ganancia real por día) ── */
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: 4px 0 12px; }
