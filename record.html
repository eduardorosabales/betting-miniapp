<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-eval' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://betting-stats-bot-production.up.railway.app https://web-production-aa47e.up.railway.app https://betting-stats-bot-canal3-production.up.railway.app https://betting-stats-bot-canal4-production.up.railway.app; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self';">
  <title>Betting Stats — Track Record</title>
  <meta name="description"
    content="Historial de apuestas verificado: ROI, winrate y CLV (closing line value) — la métrica que mide ventaja real, no suerte.">
  <meta property="og:title" content="Betting Stats — Track Record verificado">
  <meta property="og:description"
    content="ROI, winrate y CLV verificados. El CLV compara el precio tomado contra el cierre del mercado: es la forma honesta de medir si un tipster tiene ventaja real.">
  <meta property="og:type" content="website">
  <meta name="robots" content="index, follow">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
  <style>
    /* Mismo sistema de diseño que index.html (INV-MINI-44): Inter con cifras tabulares,
       grafito + un único acento índigo, verde/rojo solo semánticos. Página pública fuera
       de Telegram → el tema claro sigue la preferencia del sistema del visitante. */
    :root {
      color-scheme: dark;
      --bg: #0B0C0E;
      --card: #16181C;
      --card2: #1F2227;
      --border: rgba(255, 255, 255, .07);
      --accent: #7C83FF;
      --accent-dim: rgba(124, 131, 255, .14);
      --on-accent: #FFFFFF;
      --win: #3DD68C;
      --win-bg: rgba(61, 214, 140, .12);
      --loss: #FF6B6B;
      --loss-bg: rgba(255, 107, 107, .12);
      --pend: #F5B54A;
      --pend-bg: rgba(245, 181, 74, .12);
      --text: #F3F4F6;
      --text-2: #A1A6B0;
      --text-3: #6C717B;
      --chart-grid: rgba(255, 255, 255, .05);
      --chart-tick: #7A808B;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-xl: 26px;
      --font: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    }

    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --bg: #F2F3F5;
        --card: #FFFFFF;
        --card2: #F2F3F6;
        --border: rgba(20, 28, 46, .08);
        --accent: #5B63F0;
        --accent-dim: rgba(91, 99, 240, .10);
        --win: #16A35F;
        --win-bg: rgba(22, 163, 95, .10);
        --loss: #E5484D;
        --loss-bg: rgba(229, 72, 77, .09);
        --pend: #C9820F;
        --pend-bg: rgba(201, 130, 15, .11);
        --text: #111318;
        --text-2: #5F6570;
        --text-3: #8A909B;
        --chart-grid: rgba(20, 28, 46, .07);
        --chart-tick: #8A909B;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: var(--font);
      font-feature-settings: "cv11", "tnum";
      font-variant-numeric: tabular-nums;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.45;
      min-height: 100vh;
      padding: 16px 16px 48px;
      -webkit-font-smoothing: antialiased;
    }

    .wrap { max-width: 720px; margin: 0 auto; }

    header.top { text-align: center; padding: 28px 0 22px; }

    .logo { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 12px; }

    .logo-mark {
      width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: var(--on-accent);
      display: flex; align-items: center; justify-content: center;
    }

    .logo-mark svg { width: 19px; height: 19px; }

    .logo-text { font-weight: 650; font-size: 19px; letter-spacing: -.02em; }

    .tagline { color: var(--text-2); font-size: 14.5px; max-width: 500px; margin: 0 auto; line-height: 1.6; }

    .canal-switch {
      display: inline-flex; gap: 2px; margin: 20px auto 0; padding: 4px; max-width: 100%; overflow-x: auto;
      background: var(--card); border: 1px solid var(--border); border-radius: 999px; scrollbar-width: none;
    }

    .canal-switch::-webkit-scrollbar { display: none; }

    .canal-chip {
      border: none; background: transparent; color: var(--text-2); border-radius: 999px;
      padding: 0 16px; font-size: 13.5px; font-weight: 550; cursor: pointer; font-family: inherit;
      min-height: 38px; white-space: nowrap; transition: color .2s, background .2s;
    }

    .canal-chip.active { background: var(--card2); color: var(--text); box-shadow: 0 1px 2px rgba(0, 0, 0, .18); }

    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg);
      padding: 20px; margin: 12px 0;
    }

    .card h2 {
      font-size: 15px; font-weight: 600; letter-spacing: -.01em; margin-bottom: 10px;
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    }

    p.note { color: var(--text-2); font-size: 13px; line-height: 1.6; margin-top: 8px; }

    /* Héroe: ROI protagonista + métricas en fila con divisores. */
    .hero {
      background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 9%, var(--card)) 0%, var(--card) 70%);
      border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 24px 20px 0; overflow: hidden;
    }

    .hero-eyebrow { font-size: 13.5px; color: var(--text-2); font-weight: 500; }

    .hero-amount { font-size: 48px; font-weight: 650; letter-spacing: -.035em; line-height: 1.05; margin-top: 4px; }

    .hero-amount.green { color: var(--text); }

    .hero-sub { font-size: 13.5px; color: var(--text-2); margin-top: 8px; }

    .hero-metrics {
      display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--border); margin: 20px -20px 0;
    }

    .hero-metric { padding: 14px 8px 16px; text-align: center; min-width: 0; }

    .hero-metric + .hero-metric { border-left: 1px solid var(--border); }

    .hero-metric-v { font-size: 17px; font-weight: 650; letter-spacing: -.02em; }

    .hero-metric-l { font-size: 12px; color: var(--text-2); margin-top: 2px; }

    .sample-note {
      display: flex; gap: 10px; align-items: flex-start; background: var(--pend-bg); color: var(--text);
      border-radius: var(--radius-md); padding: 12px 14px; font-size: 13px; line-height: 1.55; margin-top: 12px;
    }

    .sample-note b { color: var(--pend); }

    .green { color: var(--win); }
    .red { color: var(--loss); }
    .amber { color: var(--pend); }

    .badge {
      display: inline-flex; align-items: center; font-size: 11.5px; font-weight: 600; padding: 3px 10px;
      border-radius: 999px; background: var(--card2); color: var(--text-2);
    }

    .badge.win { background: var(--win-bg); color: var(--win); }
    .badge.loss { background: var(--loss-bg); color: var(--loss); }
    .badge.warn { background: var(--pend-bg); color: var(--pend); }

    .clv-row {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; margin-top: 14px; background: var(--border);
      border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden;
    }

    .clv-kpi { background: var(--card); padding: 14px 10px; text-align: center; min-width: 0; }

    .clv-kpi .l { font-size: 12px; color: var(--text-2); font-weight: 500; }

    .clv-kpi .v { font-size: 19px; font-weight: 650; letter-spacing: -.02em; margin-top: 3px; }

    .chart-box { position: relative; height: 220px; margin-top: 6px; }

    canvas { max-width: 100%; }

    .cta {
      display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--accent);
      color: var(--on-accent); font-weight: 650; font-size: 15px; text-decoration: none;
      min-height: 52px; padding: 0 20px; border-radius: 999px; margin: 20px 0 6px;
    }

    .cta svg { width: 18px; height: 18px; }

    footer { text-align: center; color: var(--text-3); font-size: 12px; margin-top: 22px; line-height: 1.7; }

    .loader, .error-box { text-align: center; padding: 60px 20px; color: var(--text-2); }

    .error-box p { color: var(--text); font-size: 15px; font-weight: 600; margin-bottom: 4px; }

    .error-box button {
      margin-top: 16px; background: var(--accent); color: var(--on-accent); border: none;
      border-radius: 999px; padding: 0 22px; min-height: 44px; font-size: 14px; font-weight: 600;
      cursor: pointer; font-family: inherit;
    }

    @media (min-width: 640px) {
      .hero { padding: 30px 28px 0; }
      .hero-amount { font-size: 60px; }
      .hero-metrics { margin: 24px -28px 0; }
      .card { padding: 24px; }
      .chart-box { height: 260px; }
    }
  </style>
</head>

</html>
